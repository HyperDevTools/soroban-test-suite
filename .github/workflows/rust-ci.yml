name: Rust CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests and compile examples
        run: cargo test --all-targets

      - name: Audit locked dependencies
        run: |
          # 0.22.x is required to parse the CVSS 4.0 entries in current advisories.
          cargo install cargo-audit --version 0.22.2 --locked
          # RUSTSEC-2026-0387: crypto-bigint 0.5.5 is pulled in transitively by
          # soroban-env-host 21 (via k256/p256). No 0.5.x fix exists; the patched
          # release is 0.7.6, which requires a soroban-sdk major upgrade.
          cargo audit --file Cargo.lock --ignore RUSTSEC-2026-0387
