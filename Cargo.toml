[package]
name = "soroban-test-suite"
version = "0.1.0"
edition = "2021"
authors = ["HyperDevTools"]
description = "A comprehensive testing framework for Soroban smart contracts"
repository = "https://github.com/HyperDevTools/soroban-test-suite"
license = "MIT"
keywords = ["stellar", "soroban", "smart-contracts", "testing", "blockchain"]
categories = ["development-tools::testing", "cryptography::cryptocurrencies"]

[dependencies]
soroban-sdk = "21.0.0"
soroban-env-host = "21.0.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"

[lib]
crate-type = ["lib"]

[[example]]
name = "basic_contract_test"
path = "examples/basic_contract_test.rs"
